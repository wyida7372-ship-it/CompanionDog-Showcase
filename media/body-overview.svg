<g fill="#665e51" font-size="15"><text x="378" y="171">摄像头</text><text x="381" y="247">表情屏</text><text x="383" y="399">车轮</text></g>
<g transform="translate(515 149)">
<circle cx="14" cy="10" r="14" fill="#405d4e"/><text x="14" y="15" text-anchor="middle" font-size="12" fill="#fff">01</text><text x="43" y="17" font-size="21" font-weight="bold">脸部：看见人，也回应触摸</text>
<text x="43" y="49" font-size="15" fill="#57665e">镜头采集画面，屏幕呈现注视、眨眼和表情。</text>
<path d="M0 73 H480" stroke="#d5d3c6"/>
