<circle cx="14" cy="203" r="14" fill="#405d4e"/><text x="14" y="208" text-anchor="middle" font-size="12" fill="#fff">03</text><text x="43" y="210" font-size="21" font-weight="bold">底盘：用两侧车轮改变身体朝向</text>
<text x="43" y="242" font-size="15" fill="#57665e">双轮已在悬空台架上转动、停车；落地转向待验。</text>
