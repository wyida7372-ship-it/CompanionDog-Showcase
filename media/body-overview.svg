<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="476" viewBox="0 0 1040 476" role="img" aria-labelledby="title desc">
<title id="title">CompanionDog 的外形与运动分工</title><desc id="desc">左侧为正面造型概念：摄像头、触摸屏、车身和车轮。头部只设计为抬头低头，左右观察由两侧车轮带动整个车身。耳尾与环境感知器件已选型，整机未装配验收。</desc>
